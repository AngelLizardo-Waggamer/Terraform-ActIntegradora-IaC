name: CI/CD QuickInv

on:
  push:
    branches:
      - master

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: iac-infra-repo
  EKS_CLUSTER_NAME: iac-infra-cluster

jobs:
  build-and-deploy:
    name: Build and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # --- 1. Provision infrastructure (ensures ECR repo exists before push) ---
    - name: Bootstrap Terraform State Bucket
      run: |
        if ! aws s3api head-bucket --bucket iac-infra-tfstate-bucket 2>/dev/null; then
          echo "Creating Terraform state bucket..."
          aws s3api create-bucket --bucket iac-infra-tfstate-bucket --region ${{ env.AWS_REGION }}
          aws s3api put-bucket-versioning --bucket iac-infra-tfstate-bucket \
            --versioning-configuration Status=Enabled
        else
          echo "State bucket already exists."
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: infra
      run: terraform init

    - name: Terraform Apply
      working-directory: infra
      run: terraform apply -auto-approve

    - name: Obtener outputs de Terraform
      working-directory: infra
      run: |
        echo "RDS_ENDPOINT=$(terraform output -raw rds_endpoint)" >> $GITHUB_ENV

    # --- 2. Build and push Docker image ---
    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Construir, etiquetar y subir imagen a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

    # --- 3. Deploy to EKS ---
    - name: Actualizar KubeConfig de EKS
      run: |
        aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Desplegar aplicación con Helm
      run: |
        helm upgrade --install quickinv ./infra/helm/quickinv \
          --namespace produccion --create-namespace \
          --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }} \
          --set image.tag=${{ github.sha }} \
          --set env.DB_HOST=${{ env.RDS_ENDPOINT }} \
          --set env.DB_PASSWORD=${{ secrets.DB_PASSWORD }}
