replicaCount: 2

image:
  repository: ""  # Overridden at deploy time via --set (from ECR login output)
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Variables de entorno para conectar con RDS
env:
  DB_HOST: ""       # Overridden at deploy time via --set (from terraform output)
  DB_NAME: "appdb"
  DB_USER: "appuser"
  DB_PASSWORD: ""   # Overridden at deploy time via --set (from GitHub Secret)